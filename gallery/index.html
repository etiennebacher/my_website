    <script
      data-calepin-theme-storage-key="calepin-academic-theme"
      data-calepin-theme-param="">
(() => {
  "use strict";

  const currentScript = document.currentScript;
  const storageKey = currentScript?.dataset?.calepinThemeStorageKey || "calepin-website-theme";
  const param = currentScript?.dataset?.calepinThemeParam || "theme";
  const normalize = (value) => (value === "light" || value === "dark" ? value : "");
  const root = document.documentElement;
  const media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  const systemTheme = () => (media && media.matches ? "dark" : "light");

  let mode = "";
  if (param) {
    try {
      mode = normalize(new URL(window.location.href).searchParams.get(param) || "");
    } catch {
      mode = "";
    }
  }

  if (!mode) {
    try {
      mode = normalize(localStorage.getItem(storageKey) || "");
    } catch {
      mode = "";
    }
  }

  const theme = mode || systemTheme();
  root.dataset.calepinThemeMode = mode;
  root.dataset.theme = theme;
  root.style.colorScheme = theme;
})();

    </script>

/*
 * Tufte overlay for the whole website.
 *
 * Built as a lightweight CSS layer on top of the built-in `academic` theme
 * (see `theme.toml`). Sidenotes, side figures, dark mode, and the reading
 * column all keep the academic theme's behavior; this file only restyles it:
 * warm paper colors, Palatino-ish serif typography, italic headings, flat
 * surfaces, and a margin column that is used on every page, not just on
 * standalone notebooks.
 *
 * Prefer overriding the public `--calepin-*` tokens over targeting theme
 * internals.
 */

/* ------------------------------------------------------------------ */
/* Tokens                                                              */
/* ------------------------------------------------------------------ */

/* Warm paper and brick accents, from Calepin's Tufte case study. */
:root,
html[data-theme="light"] {
  --calepin-font-body: Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --calepin-font-heading: Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --calepin-color-background: #fffff8;
  --calepin-color-text: #12110f;
  --calepin-color-heading: #12110f;
  --calepin-color-muted: #5a5650;
  --calepin-color-border: #ded8c8;
  --calepin-surface: #fffdf0;
  --calepin-surface-code: #fffdf0;
  --calepin-surface-output: #fffdf0;
  --calepin-surface-muted: #fff8eb;
  --calepin-color-accent: #7a2e2a;
  --calepin-color-accent-hover: #5f2520;
  --calepin-color-link: #7a2e2a;
  --calepin-color-link-hover: #5f2520;
}

html[data-theme="dark"] {
  --calepin-color-background: #18130d;
  --calepin-color-text: #f6efe8;
  --calepin-color-heading: #f6efe8;
  --calepin-color-muted: #c5baa7;
  --calepin-color-border: #3b3227;
  --calepin-surface: #1f1a14;
  --calepin-surface-code: #1f1a14;
  --calepin-surface-output: #1f1a14;
  --calepin-surface-muted: #2b241b;
  --calepin-color-accent: #d58a7f;
  --calepin-color-accent-hover: #f0b7ab;
  --calepin-color-link: #d58a7f;
  --calepin-color-link-hover: #f0b7ab;
}

/* Reading measure, margin column, and the flat look Tufte's prints have. */
:root {
  --calepin-content-width: 39rem;
  --calepin-margin-width: 16rem;
  --calepin-margin-gap: 2rem;
  --calepin-line-height: 1.6;
  --calepin-heading-weight: 400;
  --calepin-radius-sm: 0;
  --calepin-radius-md: 0;
  --calepin-radius-lg: 0;
  --calepin-shadow-card: none;
}

/* ------------------------------------------------------------------ */
/* Typography                                                          */
/* ------------------------------------------------------------------ */

/* Page titles are small caps; section headings are italic rather than bold.
   `#title()` becomes the page <h1>, so a Typst `=` heading is <h2>. */
h1 {
  font-variant: small-caps;
  font-weight: 400;
  letter-spacing: 0.02em;
}

h2,
h3,
h4,
h5,
h6 {
  font-style: italic;
  font-weight: 400;
}

h1,
h2,
h3,
h4,
h5,
h6 {
  color: var(--calepin-color-heading);
}

/* Tufte sets prose unindented with space between paragraphs, and reserves
   italics and small caps for emphasis instead of bold. */
strong,
b {
  font-weight: 600;
}

blockquote {
  border-left: 0;
  padding-left: 0;
  font-style: italic;
}

hr {
  border: 0;
  border-top: 1px solid var(--calepin-color-border);
}

/* Links get a thin, low-contrast underline instead of a heavy one. */
a {
  text-decoration-thickness: 1px;
  text-underline-offset: 0.12em;
}

/* Site chrome: brand and navigation in small caps, no bold. */
.calepin-site-brand,
.academic-nav a {
  font-variant: small-caps;
  font-weight: 400;
  letter-spacing: 0.03em;
}

/* ------------------------------------------------------------------ */
/* Margin column on website pages                                      */
/* ------------------------------------------------------------------ */

/* The academic theme reserves a margin column on standalone notebooks only
   (`.academic-document-main`, which it widens to the full page width). Website
   pages keep `.academic-main` at the reading width, so margin material has
   nowhere to go. Two changes give site pages the same behavior:

   1. widen the page shell so there is empty space to the right of the reading
      column;
   2. pull side figures out of that column with a negative right margin — the
      inherited CSS already does this for sidenotes, but not for side figures,
      which rely on the wider notebook container instead.

   Below the theme's own breakpoint (content + margin + gutters = 59rem) the
   inherited CSS reflows margin material into inline boxes, so both changes have
   to stop there too. */
@media (min-width: 59.01rem) {
  body:has(.academic-main .calepin-sidenote) .academic-page,
  body:has(.academic-main .calepin-sidefigure) .academic-page {
    width: min(100% - 2rem, var(--calepin-page-width));
  }

  .academic-main .calepin-sidefigure {
    margin-right: calc(-1 * (var(--calepin-margin-width) + var(--calepin-margin-gap)));
  }
}

/* Below the breakpoint the inherited CSS reflows margin material inline at full
   column width, which lets a tall margin image take over the screen. Keep it at
   roughly its margin size and center it. */
@media (max-width: 59rem) {
  .calepin-sidefigure img {
    display: block;
    max-width: min(100%, var(--calepin-margin-width));
    margin-inline: auto;
  }
}

/* Margin material is set smaller and in the muted paper ink. */
.calepin-sidenote,
.calepin-sidefigure {
  font-size: 0.82rem;
  line-height: 1.5;
}

/* Tufte numbers sidenotes with a superscript on both ends rather than a
   bracketed reference. */
.calepin-sidenote-numbered::before {
  content: attr(data-sidenote-number);
  vertical-align: super;
  font-size: 0.72em;
  font-weight: 400;
  margin-right: 0.2rem;
}

[role="doc-noteref"] {
  font-weight: 400;
}

/* ------------------------------------------------------------------ */
/* Floating table of contents                                          */
/* ------------------------------------------------------------------ */

/* The inherited academic theme floats the TOC into the right margin, which is
   where sidenotes and margin figures already live. Move it to a fixed column
   on the left instead, as on the old site, and stop the shell from reserving
   right-margin space for it — it is out of flow now, and the sidenote rule
   above already widens the page where that is needed. */
.academic-page .calepin-website-toc {
  display: none;
}

.academic-page.has-toc {
  width: min(100% - 2rem, var(--calepin-content-width));
}

/* Only show it once the viewport is wide enough for a full reading column, the
   right-hand margin, and the TOC beside them; below that there is nowhere to
   put it without overlapping the prose. */
@media (min-width: 84rem) {
  .academic-page .calepin-website-toc {
    display: block;
    position: fixed;
    /* Track the left edge of the reading column rather than the window edge,
       so the TOC stays near the text on very wide screens. */
    left: max(1.5rem, calc(50% - (var(--calepin-page-width) / 2) - 13.5rem));
    top: calc(var(--calepin-topbar-height) + 5.5rem);
    width: 12rem;
    max-height: calc(100vh - var(--calepin-topbar-height) - 7rem);
    margin: 0;
    overflow-y: auto;
    scrollbar-width: thin;
    font-size: 0.75rem;
    line-height: 1.4;
  }

  .academic-page.has-toc {
    width: min(100% - 2rem, var(--calepin-page-width));
  }
}

/* Quiet by default, and legible for the section you are actually reading —
   the same treatment the old site's TOC used. */
.calepin-website-toc a {
  opacity: 0.45;
  transition: opacity 0.2s;
}

.calepin-website-toc a:hover,
.calepin-website-toc a:focus {
  background: none;
  opacity: 0.8;
}

.calepin-website-toc a.active {
  background: none;
  opacity: 1;
  font-weight: 600;
}

.calepin-website-toc-title {
  font-variant: small-caps;
  letter-spacing: 0.04em;
  text-transform: none;
}

/* ------------------------------------------------------------------ */
/* Figures, tables, code                                               */
/* ------------------------------------------------------------------ */

figcaption {
  color: var(--calepin-color-muted);
  font-size: 0.85rem;
  font-style: italic;
}

/* Typst exports an image's intrinsic size as `width`/`height` attributes. When
   Typst code sets only the height (`box(image(.., height: 12pt))`, e.g. an
   inline icon), the intrinsic `width` attribute still applies and stretches the
   image to its natural width at 12pt tall. Let the width follow the height. */
.calepin-content img[style*="height:"] {
  width: auto;
}

/* Those inline icons are monochrome SVGs inlined as data URIs, so in dark mode
   they would be black on a near-black page. The selector is deliberately
   narrow: only images sized by height are icons here, so plots and photographs
   are left alone. */
html[data-theme="dark"] .calepin-content img[style*="height:"] {
  filter: invert(1);
}

/* Tufte's tables are ruled horizontally only. */
table {
  border-collapse: collapse;
}

table th,
table td {
  border: 0;
  border-bottom: 1px solid var(--calepin-color-border);
}

table thead th {
  border-bottom: 1.5px solid var(--calepin-color-text);
  font-weight: 400;
  font-variant: small-caps;
}

table tbody tr:last-child td {
  border-bottom: 1.5px solid var(--calepin-color-text);
}

/* Code sits on the paper rather than in a boxed card. */
pre {
  border: 0;
  border-left: 2px solid var(--calepin-color-border);
}

/* ------------------------------------------------------------------ */
/* Footer                                                              */
/* ------------------------------------------------------------------ */

.calepin-site-footer {
  font-size: 0.82rem;
  font-style: italic;
  border: none;
}

/* Separate the footer rows with a middot instead of whitespace alone. The
   inherited flex row spaces them with a `gap`, so drop the horizontal part of
   it and let the separator's own margins do the spacing — that keeps the dot
   centred between the two items rather than hugging the one it belongs to.
   It trails its item, so a wrapped row ends on a dot rather than starting on
   one. */
.calepin-site-footer-links {
  column-gap: 0;
}

.calepin-site-footer-links li:not(:last-child)::after {
  content: "·";
  margin-inline: 0.5rem;
}

/* Pages shorter than the viewport would otherwise leave the footer floating in
   the middle of the paper. Make the body a column and let the page shell absorb
   the leftover height, so the footer sits on the bottom edge when the content is
   short and simply follows the text when it is not. Pinning it with `position:
   fixed` would instead cover the end of long pages.

   `dvh` tracks the browser chrome on mobile, where `100vh` is the taller
   toolbars-hidden height and pushes the footer just off screen; the `vh` line
   stays as a fallback. The topbar keeps its `position: sticky` — sticky flex
   items stick within the flex container, which is the full-height body here. */
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
}

.academic-page {
  flex: 1 0 auto;
}

/* For the table of blog posts */
tbody > tr > td {
  background: transparent !important;
}

    <script>
(() => {
  "use strict";

  const buttons = document.querySelectorAll("[data-calepin-theme-toggle], #calepin-theme-button");
  if (!buttons.length) return;

  const order = ["", "light", "dark"];
  const labels = { "": "Theme: Auto", light: "Theme: Light", dark: "Theme: Dark" };
  const icons = {
    "": `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 0 0 18" fill="currentColor" opacity="0.32" stroke="none"></path></svg>`,
    light: `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>`,
    dark: `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.99 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 20.99 12.79z"></path></svg>`,
  };

  const normalize = (value) => value === "light" || value === "dark" ? value : "";
  const root = document.documentElement;
  const media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  const storageKey = (button) => button.dataset.calepinThemeStorageKey || "calepin-theme";
  const urlParam = (button) => button.dataset.calepinThemeParam || "";
  const systemTheme = () => media && media.matches ? "dark" : "light";

  function readUrl(button) {
    const param = urlParam(button);
    if (!param) return "";
    try {
      return normalize(new URL(window.location.href).searchParams.get(param) || "");
    } catch {
      return "";
    }
  }

  function clearUrl(button) {
    const param = urlParam(button);
    if (!param) return;
    try {
      const url = new URL(window.location.href);
      url.searchParams.delete(param);
      window.history.replaceState({}, "", url.toString());
    } catch {
      /* ignore URL errors */
    }
  }

  function readStored(button) {
    try {
      return normalize(localStorage.getItem(storageKey(button)) || "");
    } catch {
      return "";
    }
  }

  function writeStored(button, value) {
    try {
      if (value) localStorage.setItem(storageKey(button), value);
      else localStorage.removeItem(storageKey(button));
    } catch {
      /* ignore storage errors */
    }
  }

  function readTheme(button) {
    const fromUrl = readUrl(button);
    if (fromUrl) {
      writeStored(button, fromUrl);
      clearUrl(button);
      return fromUrl;
    }
    return readStored(button);
  }

  function applyTheme(value) {
    const mode = normalize(value);
    const theme = mode || systemTheme();
    root.dataset.calepinThemeMode = mode;
    root.dataset.theme = theme;
    root.style.colorScheme = theme;
    buttons.forEach((button) => {
      const label = labels[mode] || labels[""];
      button.innerHTML = icons[mode] || icons[""];
      button.setAttribute("aria-label", label);
      button.setAttribute("title", label);
    });
  }

  applyTheme(readTheme(buttons[0]));

  buttons.forEach((button) => {
    if (button.dataset.calepinThemeBound === "true") return;
    button.dataset.calepinThemeBound = "true";
    button.addEventListener("click", () => {
      const current = normalize(root.dataset.calepinThemeMode || "");
      const next = order[(order.indexOf(current) + 1) % order.length];
      applyTheme(next);
      writeStored(button, next);
    });
  });

  window.addEventListener("pageshow", (event) => {
    if (event.persisted) applyTheme(readTheme(buttons[0]));
  });

  window.addEventListener("storage", (event) => {
    if (event.key === storageKey(buttons[0])) applyTheme(readStored(buttons[0]));
  });

  if (media) {
    const updateSystemTheme = () => {
      if (!normalize(root.dataset.calepinThemeMode || "")) applyTheme("");
    };
    if (media.addEventListener) media.addEventListener("change", updateSystemTheme);
    else if (media.addListener) media.addListener(updateSystemTheme);
  }
})();

    <script>
(() => {
  "use strict";

  const selects = document.querySelectorAll("select[data-calepin-language-picker]");
  if (!selects.length) return;

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function closeAll(except) {
    document.querySelectorAll(".calepin-language-picker.is-open").forEach((picker) => {
      if (picker === except) return;
      picker.classList.remove("is-open");
      picker.open = false;
      const summary = picker.querySelector("summary");
      if (summary) summary.setAttribute("aria-expanded", "false");
    });
  }

  function enhance(select) {
    if (select.dataset.calepinLanguageBound === "true") return;
    select.dataset.calepinLanguageBound = "true";

    const options = Array.from(select.options).filter((option) => option.value);
    if (options.length <= 1) return;

    const selected = options.find((option) => option.selected) || options[0];
    const picker = document.createElement("details");
    picker.className = "calepin-language-picker dropdown";

    const summary = document.createElement("summary");
    summary.className = "calepin-language-picker-button";
    summary.setAttribute("role", "button");
    summary.setAttribute("aria-haspopup", "menu");
    summary.setAttribute("aria-expanded", "false");
    summary.setAttribute("aria-label", select.getAttribute("aria-label") || "Language");
    summary.innerHTML = `<span>${escapeHtml(selected.textContent)}</span>`;

    const menu = document.createElement("ul");
    menu.className = "calepin-language-picker-menu";
    menu.setAttribute("role", "menu");

    options.forEach((option) => {
      const li = document.createElement("li");
      const item = document.createElement("a");
      item.href = option.value;
      item.setAttribute("role", "menuitem");
      item.innerHTML = `<span>${escapeHtml(option.textContent)}</span>`;
      if (option.selected) item.setAttribute("aria-current", "true");
      li.appendChild(item);
      menu.appendChild(li);
    });

    summary.addEventListener("click", () => {
      const open = !picker.open;

    picker.addEventListener("toggle", () => {
      picker.classList.toggle("is-open", picker.open);
      summary.setAttribute("aria-expanded", picker.open ? "true" : "false");

    select.hidden = true;

  document.addEventListener("click", (event) => {
    if (!event.target.closest(".calepin-language-picker")) closeAll();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closeAll();
  });
})();

(() => {
  "use strict";

  const selector = window.CalepinCopyCode?.selector ||
    "div.sourceCode, pre.sourceCode, .cell-output, .cell-output-stdout, .cell-output-stderr";
  const buttonClass = window.CalepinCopyCode?.buttonClass || "calepin-copy-code";
  const copiedClass = window.CalepinCopyCode?.copiedClass || "copied";
  const icon = window.CalepinCopyCode?.icon ||
    `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
  const copiedIcon = window.CalepinCopyCode?.copiedIcon ||
    `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17 4 12"></path></svg>`;

  function copyText(text) {
    if (navigator.clipboard?.writeText) {
      return navigator.clipboard.writeText(text);
    }
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.setAttribute("readonly", "");
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.select();
    try {
      document.execCommand("copy");
    } finally {
      textarea.remove();
    }
    return Promise.resolve();
  }

  function codeText(node) {
    if (!node) return "";
    if (node.nodeType === Node.TEXT_NODE) return node.nodeValue || "";
    if (node.nodeType !== Node.ELEMENT_NODE) return "";
    if (node.tagName === "BR") return "\n";
    return Array.from(node.childNodes).map(codeText).join("");
  }

  document.querySelectorAll(selector).forEach((block) => {
    if (block.dataset.calepinCopyBound === "true" || block.querySelector(`:scope > .${buttonClass}`)) {
      return;
    }
    block.dataset.calepinCopyBound = "true";
    const button = document.createElement("button");
    button.type = "button";
    button.className = buttonClass;
    button.setAttribute("aria-label", "Copy code");
    button.setAttribute("title", "Copy code");
    button.innerHTML = icon;
    let restoreTimeout = null;
    button.addEventListener("click", async () => {
      if (restoreTimeout !== null) {
        window.clearTimeout(restoreTimeout);
        restoreTimeout = null;
      }
      const code = block.querySelector("pre code, code, pre");
      const text = codeText(code);
      try {
        await copyText(text);
        button.classList.add(copiedClass);
        button.innerHTML = copiedIcon;
        restoreTimeout = window.setTimeout(() => {
          button.classList.remove(copiedClass);
          button.innerHTML = icon;
          restoreTimeout = null;
        }, 900);
      } catch {
        button.classList.remove(copiedClass);
        button.innerHTML = icon;
      }
    });
    block.prepend(button);
  });
})();

    <script>
(() => {
  "use strict";

  const pagefindModal = () => document.querySelector("pagefind-modal");

  function modalSearchInput(modal) {
    if (!modal) return null;
    return modal.querySelector("pagefind-input input, input[type='search'], input");
  }

  function setModalSearchQuery(modal, query) {
    if (!query) return false;
    const input = modalSearchInput(modal);
    if (!input) return false;
    input.value = query;
    input.dispatchEvent(new Event("input", { bubbles: true }));
    return true;
  }

  function focusModalSearch(modal) {
    const input = modalSearchInput(modal);
    if (!input) return false;
    input.focus();
    return true;
  }

  async function openPagefindSearch(query) {
    const modal = pagefindModal();
    if (!modal) return false;

    if (typeof modal.open !== "function" && window.customElements?.whenDefined) {
      try {
        await window.customElements.whenDefined("pagefind-modal");
      } catch {
        /* ignore custom element registration errors */
      }
    }

    if (typeof modal.open !== "function") return false;
    modal.open();

    const sync = () => {
      const hasQuery = setModalSearchQuery(modal, query);
      const hasFocus = focusModalSearch(modal);
      return hasQuery || hasFocus;
    };

    if (!sync()) {
      requestAnimationFrame(() => {
        if (!sync()) window.setTimeout(sync, 50);
      });
    }

    return true;
  }

  function isTextEntryElement(element) {
    if (!element) return false;
    return (
      element.isContentEditable ||
      element.tagName === "INPUT" ||
      element.tagName === "SELECT" ||
      element.tagName === "TEXTAREA"
    );
  }

  const SEARCH_SUGGESTION_LIMIT = 20;
  const SEARCH_SUBRESULT_LIMIT = 3;
  const SEARCH_SUGGESTION_MIN_LENGTH = 2;
  const SEARCH_SUGGESTION_DELAY = 160;
  let pagefindModulePromise = null;

  function pagefindBundlePath() {
    const script = document.querySelector(
      'script[src$="pagefind-component-ui.js"], script[src$="pagefind-ui.js"]',
    );
    if (script?.src) return new URL("./", script.src).toString();
    return new URL("pagefind/", window.location.href).toString();
  }

  function loadPagefindModule() {
    if (!pagefindModulePromise) {
      pagefindModulePromise = import(`${pagefindBundlePath()}pagefind.js`);
    }
    return pagefindModulePromise;
  }

  function plainTextFromHtml(html) {
    const element = document.createElement("div");
    element.innerHTML = html || "";
    return element.textContent?.trim() || "";
  }

  function setSearchResultsOpen(input, results, isOpen) {
    results.hidden = !isOpen;
    input.setAttribute("aria-expanded", String(isOpen));
  }

  function clearSearchResults(input, results) {
    results.innerHTML = "";
    setSearchResultsOpen(input, results, false);
  }

  function renderSearchMessage(input, results, message) {
    results.innerHTML = "";
    const item = document.createElement("p");
    item.className = "calepin-website-search-empty";
    item.textContent = message;
    results.appendChild(item);
    setSearchResultsOpen(input, results, true);
  }

  function renderSearchResults(input, results, items) {
    results.innerHTML = "";
    if (!items.length) {
      renderSearchMessage(input, results, "No results");
      return;
    }

    const basePathPrefix = localCanonicalBasePathPrefix();
    const addSearchLink = (item, className, titleClassName, excerptClassName) => {
      const href = hrefWithoutLocalBasePath(item.meta?.url || item.url || "", basePathPrefix);
      if (!href) return null;

      const link = document.createElement("a");
      link.className = className;
      link.href = href;
      link.setAttribute("role", "option");

      const title = document.createElement("span");
      title.className = titleClassName;
      title.textContent = item.meta?.title || item.title || href;
      link.appendChild(title);

      const excerptText = plainTextFromHtml(item.excerpt || item.content || "");
      if (excerptText) {
        const excerpt = document.createElement("span");
        excerpt.className = excerptClassName;
        excerpt.textContent = excerptText;
        link.appendChild(excerpt);
      }

      return link;
    };

    for (const item of items) {
      const link = addSearchLink(
        item,
        "calepin-website-search-result",
        "calepin-website-search-result-title",
        "calepin-website-search-result-excerpt",
      );
      if (!link) continue;
      results.appendChild(link);

      const subResults = Array.isArray(item.sub_results)
        ? item.sub_results.slice(0, SEARCH_SUBRESULT_LIMIT)
        : [];
      if (!subResults.length) continue;

      const nested = document.createElement("div");
      nested.className = "calepin-website-search-subresults";
      for (const subResult of subResults) {
        const subLink = addSearchLink(
          subResult,
          "calepin-website-search-subresult",
          "calepin-website-search-subresult-title",
          "calepin-website-search-subresult-excerpt",
        );
        if (subLink) nested.appendChild(subLink);
      }
      if (nested.children.length) results.appendChild(nested);
    }

    setSearchResultsOpen(input, results, Boolean(results.children.length));
  }

  function initMobileSearchTriggers() {
    document.querySelectorAll("[data-calepin-mobile-search-trigger]").forEach((button) => {
      if (button.dataset.calepinSearchBound === "true") return;
      button.dataset.calepinSearchBound = "true";
      button.addEventListener("click", (event) => {
        event.preventDefault();
        openPagefindSearch("");
      });
    });
  }

  function initNavbarSearch() {
    const input = document.querySelector("[data-calepin-search-input]");
    if (!input) return;
    const form = input.closest("[data-calepin-search-form]");
    const results = document.querySelector("[data-calepin-search-results]");

    let opening = false;
    let searchTimer = 0;
    let searchToken = 0;
    const openFromInput = async () => {
      if (opening) return;
      opening = true;
      try {
        const opened = await openPagefindSearch(input.value.trim());
        if (opened) input.value = "";
        if (opened && results) clearSearchResults(input, results);
      } finally {
        opening = false;
      }
    };

    const scheduleSuggestions = () => {
      if (!results) return;
      window.clearTimeout(searchTimer);
      const query = input.value.trim();
      const token = ++searchToken;
      if (query.length < SEARCH_SUGGESTION_MIN_LENGTH) {
        clearSearchResults(input, results);
        return;
      }

      searchTimer = window.setTimeout(async () => {
        try {
          const pagefind = await loadPagefindModule();
          const search = await pagefind.search(query);
          if (token !== searchToken || input.value.trim() !== query) return;
          const items = await Promise.all(
            search.results.slice(0, SEARCH_SUGGESTION_LIMIT).map((result) => result.data()),
          );
          if (token !== searchToken || input.value.trim() !== query) return;
          renderSearchResults(input, results, items);
        } catch {
          if (token === searchToken) renderSearchMessage(input, results, "Search unavailable");
        }
      }, SEARCH_SUGGESTION_DELAY);
    };

    form?.addEventListener("submit", (event) => {
      event.preventDefault();
      openFromInput();
    });

    input.addEventListener("input", scheduleSuggestions);
    input.addEventListener("focus", scheduleSuggestions);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        openFromInput();
      } else if (event.key === "Escape") {
        if (results) clearSearchResults(input, results);
        input.blur();
      }
    });

    document.addEventListener("click", (event) => {
      if (!results || form?.contains(event.target)) return;
      clearSearchResults(input, results);
    });

    document.addEventListener("keydown", (event) => {
      const modifier = /Mac|iPhone|iPad|iPod/.test(window.navigator.platform)
        ? event.metaKey
        : event.ctrlKey;
      if (
        !modifier ||
        event.altKey ||
        event.shiftKey ||
        event.key.toLowerCase() !== "k" ||
        isTextEntryElement(document.activeElement)
      ) {
        return;
      }

      event.preventDefault();
      input.focus();
    });
  }

  function isLoopbackHost(hostname) {
    return (
      hostname === "localhost" ||
      hostname === "127.0.0.1" ||
      hostname === "0.0.0.0" ||
      hostname === "::1" ||
      hostname === "[::1]"
    );
  }

  function localCanonicalBasePathPrefix() {
    if (!isLoopbackHost(window.location.hostname)) return "";
    const canonical = document.querySelector('link[rel="canonical"]')?.href;
    if (!canonical) return "";

    try {
      const canonicalPath = new URL(canonical).pathname;
      const currentPath = window.location.pathname || "/";
      if (canonicalPath === currentPath) return "";
      if (canonicalPath.endsWith(currentPath)) {
        return canonicalPath.slice(0, -currentPath.length).replace(/\/$/, "");
      }
      if (canonicalPath.endsWith("/index.html")) {
        const indexPath = currentPath.endsWith("/") ? `${currentPath}index.html` : currentPath;
        if (canonicalPath.endsWith(indexPath)) {
          return canonicalPath.slice(0, -indexPath.length).replace(/\/$/, "");
        }
      }
    } catch {
      return "";
    }
    return "";
  }

  function hrefWithoutLocalBasePath(href, basePathPrefix) {
    if (!href || !basePathPrefix) return href;
    try {
      const url = new URL(href, window.location.href);
      if (url.origin !== window.location.origin) return href;
      if (url.pathname !== basePathPrefix && !url.pathname.startsWith(`${basePathPrefix}/`)) {
        return href;
      }
      url.pathname = url.pathname.slice(basePathPrefix.length) || "/";
      return url.toString();
    } catch {
      return href;
    }
  }

  function initPagefindLocalLinks() {
    const basePathPrefix = localCanonicalBasePathPrefix();
    if (!basePathPrefix) return;

    const selector =
      "pagefind-modal a[href], pagefind-searchbox a[href], .calepin-website-search-results a[href]";
    const normalizeLinks = () => {
      document.querySelectorAll(selector).forEach((link) => {
        const next = hrefWithoutLocalBasePath(link.getAttribute("href"), basePathPrefix);
        if (next && next !== link.getAttribute("href")) link.setAttribute("href", next);
      });
    };

    document.addEventListener("click", (event) => {
      const link = event.target.closest(selector);
      if (!link) return;
      const next = hrefWithoutLocalBasePath(link.getAttribute("href"), basePathPrefix);
      if (!next || next === link.getAttribute("href")) return;
      event.preventDefault();
      window.location.href = next;
    });

    normalizeLinks();
    new MutationObserver(normalizeLinks).observe(document.body, {
      childList: true,
      subtree: true,
    });
  }

  const hasSearch = !!(
    document.querySelector("pagefind-modal") ||
    document.querySelector("pagefind-searchbox") ||
    document.querySelector("[data-calepin-search-input]") ||
    document.querySelector("[data-calepin-search-results]") ||
    document.querySelector("[data-calepin-mobile-search-trigger]") ||
    document.querySelector(".calepin-website-search-results")
  );
  if (!hasSearch) return;

  initMobileSearchTriggers();
  initNavbarSearch();
  initPagefindLocalLinks();
})();

    </script>
    
    <script>
(() => {
  "use strict";

  const toc = document.querySelector(".calepin-website-toc");
  if (!toc) return;

  const entries = Array.from(toc.querySelectorAll('a[href^="#"]'))
    .map((link) => {
      const id = decodeURIComponent(link.hash.slice(1));
      return { link, heading: document.getElementById(id) };
    })
    .filter((entry) => entry.heading);
  if (!entries.length) return;

  let activeLink = null;
  let ticking = false;

  function revealInToc(link) {
    const tocBox = toc.getBoundingClientRect();
    const linkBox = link.getBoundingClientRect();
    const padding = 12;

    if (linkBox.top < tocBox.top + padding) {
      toc.scrollBy({ top: linkBox.top - tocBox.top - padding, behavior: "smooth" });
    } else if (linkBox.bottom > tocBox.bottom - padding) {
      toc.scrollBy({ top: linkBox.bottom - tocBox.bottom + padding, behavior: "smooth" });
    }
  }

  function setActive(link) {
    if (link === activeLink) return;
    activeLink?.classList.remove("active");
    activeLink?.removeAttribute("aria-current");
    activeLink = link;
    activeLink.classList.add("active");
    activeLink.setAttribute("aria-current", "location");
    revealInToc(activeLink);
  }

  function update() {
    const topbar = document.querySelector(".calepin-website-topbar, .academic-topbar");
    const threshold = (topbar?.offsetHeight || 0) + 24;
    let current = entries[0];

    for (const entry of entries) {
      if (entry.heading.getBoundingClientRect().top > threshold) break;
      current = entry;
    }

    setActive(current.link);
    ticking = false;
  }

  function requestUpdate() {
    if (ticking) return;
    ticking = true;
    window.requestAnimationFrame(update);
  }

  window.addEventListener("scroll", requestUpdate, { passive: true });
  window.addEventListener("resize", requestUpdate);
  window.addEventListener("hashchange", requestUpdate);
  requestUpdate();
})();

    <script>
(() => {
  "use strict";

  function initScrollAwareTopbar() {
    const topbar = document.querySelector(".academic-topbar");
    if (!topbar) return;

    const menu = document.getElementById("academic-menu");
    const scrollThreshold = Math.max(32, topbar.offsetHeight * 1.5);
    let lastScrollY = window.scrollY;
    let ticking = false;

    function menuIsOpen() {
      return menu?.classList.contains("is-open") ?? false;
    }

    function setHidden(hidden) {
      topbar.classList.toggle("is-hidden", hidden);
    }

    function update() {
      const currentScrollY = Math.max(0, window.scrollY);
      const delta = currentScrollY - lastScrollY;
      const belowThreshold = currentScrollY > scrollThreshold;
      const scrollingDown = delta > 6;
      const scrollingUp = delta < -6;

      if (!belowThreshold || scrollingUp || menuIsOpen() || topbar.matches(":focus-within")) {
        setHidden(false);
      } else if (scrollingDown) {
        setHidden(true);
      }

      lastScrollY = currentScrollY;
      ticking = false;
    }

    function requestUpdate() {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(update);
    }

    window.addEventListener("scroll", requestUpdate, { passive: true });
    topbar.addEventListener("focusin", () => setHidden(false));
    topbar.addEventListener("focusout", requestUpdate);
  }

  function initMobileMenu() {
    const button = document.querySelector(".academic-nav-toggle");
    const menu = document.getElementById("academic-menu");
    if (!button || !menu) return;

    const topbar = button.closest(".academic-topbar");

    function setOpen(open) {
      menu.classList.toggle("is-open", open);
      topbar?.classList.remove("is-hidden");
      button.setAttribute("aria-expanded", open ? "true" : "false");
    }

    button.addEventListener("click", () => {
      setOpen(!menu.classList.contains("is-open"));
    });

    menu.addEventListener("click", (event) => {
      if (event.target.closest("a")) setOpen(false);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") setOpen(false);
    });
  }

  initScrollAwareTopbar();
  initMobileMenu();
})();

    <script>
document.addEventListener("DOMContentLoaded", function () {
  var grid = document.querySelector(".gallery-grid");
  if (!grid) return;

  var links = Array.from(grid.querySelectorAll("a"));
  var currentIndex = 0;

  var overlay = document.createElement("div");
  overlay.className = "gallery-lightbox";

  var prev = document.createElement("button");
  prev.className = "gallery-lightbox-arrow gallery-lightbox-prev";
  prev.textContent = "\u2039";

  var next = document.createElement("button");
  next.className = "gallery-lightbox-arrow gallery-lightbox-next";
  next.textContent = "\u203A";

  var img = document.createElement("img");
  overlay.appendChild(prev);
  overlay.appendChild(img);
  overlay.appendChild(next);
  document.body.appendChild(overlay);

  function show(index) {
    currentIndex = (index + links.length) % links.length;
    img.src = links[currentIndex].href;
    overlay.classList.add("active");
  }

  function close() {
    overlay.classList.remove("active");
  }

  grid.addEventListener("click", function (e) {
    var link = e.target.closest("a");
    if (!link) return;
    e.preventDefault();
    show(links.indexOf(link));
  });

  prev.addEventListener("click", function (e) {
    e.stopPropagation();
    show(currentIndex - 1);
  });

  next.addEventListener("click", function (e) {
    e.stopPropagation();
    show(currentIndex + 1);
  });

  overlay.addEventListener("click", function (e) {
    if (e.target === overlay) close();
  });

  document.addEventListener("keydown", function (e) {
    if (!overlay.classList.contains("active")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") show(currentIndex - 1);
    if (e.key === "ArrowRight") show(currentIndex + 1);
  });
});

    <script>
/*
 * Utterances comment threads. Paired with theme/css/80_utterances.css.
 *
 * The theme bundles every js/ file into every page, so this bails out on
 * anything that is not a single post.
 */
document.addEventListener("DOMContentLoaded", function () {
  // Posts live at /posts/<slug>/; /posts/ itself is the blog listing, which
  // should not get a comment box. Strip the file name so the check works both
  // on the deployed site and under `calepin serve`.
  var path = location.pathname.replace(/index\.html$/, "");
  if (!/^\/posts\/[^/]+\/$/.test(path)) {
    return;
  }

  // The previous site appended to <article>; this theme wraps the post body in
  // <main class="calepin-content"> instead.
  var container = document.querySelector("main.calepin-content");
  if (!container) {
    return;
  }

  function currentTheme() {
    return document.documentElement.dataset.theme === "dark"
      ? "github-dark"
      : "github-light";
  }

  var script = document.createElement("script");
  script.src = "https://utteranc.es/client.js";
  script.setAttribute("repo", "etiennebacher/my_website");
  // The previous site used `og:title`, which was the bare post title there.
  // Calepin appends " | Etienne Bacher" to og:title, so use `title`
  // (document.title), which still holds the bare post title and therefore maps
  // to the same issue titles as before.
  script.setAttribute("issue-term", "title");
  script.setAttribute("crossorigin", "anonymous");
  script.setAttribute("label", "comment_thread");
  script.setAttribute("theme", currentTheme());
  container.appendChild(script);

  // Follow the site's light/dark toggle, which rewrites data-theme on <html>.
  new MutationObserver(function () {
    var frame = document.querySelector(".utterances-frame");
    if (!frame || !frame.contentWindow) {
      return;
    }
    frame.contentWindow.postMessage(
      { type: "set-theme", theme: currentTheme() },
      "https://utteranc.es"
    );
  }).observe(document.documentElement, { attributeFilter: ["data-theme"] });
});
